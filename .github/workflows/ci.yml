name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python tests/test_hdx.py -v
      - name: Syntax check
        run: python -m py_compile scripts/hdx.py scripts/hdx_browser.py tests/test_hdx.py tools/build_release.py
      - name: Distribution consistency
        run: python tools/build_release.py --check
      - name: CLI smoke test
        run: |
          scripts/hdx --version
          scripts/hdx routes --format json > /tmp/routes.json
          scripts/hdx event-draft template --format json > /tmp/event-draft.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build archives
        run: python tools/build_release.py
      - name: Verify archives
        run: |
          python - <<'PY'
          import pathlib, zipfile
          archives = sorted(pathlib.Path("dist").glob("*.zip"))
          assert len(archives) == 4, archives
          for archive in archives:
              with zipfile.ZipFile(archive) as handle:
                  bad = handle.testzip()
                  assert bad is None, (archive, bad)
          PY
      - name: Scan release file names
        run: |
          python - <<'PY'
          import pathlib, re, zipfile
          forbidden = re.compile(r"(^|/)(\.env|cookies?|tokens?|profile\.json|policy\.json|signup\.json|.*\.db)$", re.I)
          for archive in pathlib.Path("dist").glob("*.zip"):
              with zipfile.ZipFile(archive) as handle:
                  hits = [name for name in handle.namelist() if forbidden.search(name)]
                  assert not hits, (archive, hits)
          PY
      - name: Scan repository and release contents for secrets and personal data
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, zipfile

          patterns = {
              "email": re.compile(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", re.I),
              "cn_phone": re.compile(r"(?<!\d)1[3-9]\d{9}(?!\d)"),
              "cn_identity": re.compile(r"(?<!\d)\d{17}[\dXx](?!\d)"),
              "private_key": re.compile("BEGIN " + r"(?:RSA |EC |OPENSSH )?PRIVATE KEY"),
              "known_token_prefix": re.compile(
                  r"gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|"
                  r"AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}"
              ),
          }

          def scan(label, data):
              text = data.decode("utf-8", errors="ignore")
              hits = [name for name, pattern in patterns.items() if pattern.search(text)]
              assert not hits, (label, hits)

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for name in tracked:
              if name == ".github/workflows/ci.yml":
                  continue
              path = pathlib.Path(name)
              if path.is_file():
                  scan(name, path.read_bytes())

          for archive in pathlib.Path("dist").glob("*.zip"):
              with zipfile.ZipFile(archive) as handle:
                  for name in handle.namelist():
                      scan(f"{archive}:{name}", handle.read(name))
          PY
